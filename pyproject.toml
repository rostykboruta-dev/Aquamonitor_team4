[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquamonitor"
version = "0.1.0"
description = "Water level monitoring and short-term forecast (AquaMonitor)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aquamonitor = "aquamonitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
